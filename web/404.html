<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 通往 Linux 之路</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f9; color: #172c40; font: 15px/1.8 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; }
  .card { max-width: 460px; padding: 40px 36px; text-align: center; border: 1px solid #e1e8ee; border-radius: 14px; background: #fff; }
  .code { font: 700 56px/1.2 ui-monospace, Consolas, monospace; color: #2fb5c6; }
  h1 { font-size: 19px; margin: 10px 0 6px; }
  p { color: #64768a; margin: 0 0 22px; font-size: 13px; }
  .back { display: inline-block; padding: 10px 22px; border-radius: 8px; background: #2fb5c6; color: #fff; font-weight: 650; text-decoration: none; font-size: 14px; }
  .back:hover { background: #066d79; }
  @media (prefers-color-scheme: dark) { body { background: #0b0f14; color: #e6edf3; } .card { border-color: #2b3a4a; background: #0d1117; } p { color: #9aa9b7; } }
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能失效，或内容已被移动。回到首页从学习路线重新开始，或在顶栏搜索框中按关键词查找。</p>
    <a class="back" href="./">← 回到学习首页</a>
  </main>
</body>
</html>
