name: Tutorial checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  content-and-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check links, chapter counts and Bash syntax
        run: node scripts/check-content.mjs
      - name: Validate video metadata and generated recommendations
        run: |
          node scripts/check-media.mjs
          node scripts/sync-media.mjs --check
      - name: Backup regression tests
        run: node --test scripts/backup.test.mjs
      - name: Verify chapter navigation rules
        run: node --test scripts/chapter-navigation.test.mjs
      - name: Verify health report exit codes
        run: node --test scripts/health-report.test.mjs
      - name: Verify preview port diagnostics
        run: node --test scripts/serve-site.test.mjs
      - name: Verify media audit classification
        run: node --test scripts/audit-media.test.mjs
      - name: Parse SVG assets
        shell: pwsh
        run: ./scripts/check-svg.ps1
      - name: Validate Python and the HTTP response
        run: python3 -B scripts/examples.test.py
      - name: Verify media provenance, generated SVG and GPIO simulation
        run: python3 -B scripts/media.test.py
      - name: Verify camera lifecycle without hardware
        run: python3 -B scripts/camera.test.py
      - name: Run Linux filesystem and scheduling examples
        run: python3 -B scripts/labs.test.py
      - name: Check shell scripts
        run: shellcheck scripts/*.sh
      - name: Build and exercise Docker example
        run: bash scripts/check-docker.sh
  learning-site:
    needs: content-and-examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked site dependencies
        run: pnpm install --frozen-lockfile
      - name: Build reading and media site
        run: pnpm run build
      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Test desktop, mobile and media controls
        run: pnpm run test:site
      - name: Save failed browser traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-test-results
          path: test-results/
          retention-days: 7
      - name: Upload Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: learning-site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy learning site
        id: deployment
        uses: actions/deploy-pages@v5
