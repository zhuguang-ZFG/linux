<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="终端打字动画">
  <defs>
    <clipPath id="typed">
      <rect x="90" y="88" width="0" height="30">
        <animate attributeName="width" values="0;0;470;470;0;0" keyTimes="0;0.06;0.34;0.90;0.96;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="864" height="404" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="8" y="8" width="864" height="46" rx="16" fill="#1c2128"/>
  <rect x="8" y="40" width="864" height="14" fill="#1c2128"/>
  <circle cx="44" cy="31" r="8" fill="#ff5f56"/>
  <circle cx="72" cy="31" r="8" fill="#ffbd2e"/>
  <circle cx="100" cy="31" r="8" fill="#27c93f"/>
  <text x="440" y="38" fill="#8b949e" font-size="16" text-anchor="middle">zugu@linux-roadmap: ~</text>

  <!-- 提示符 -->
  <text x="66" y="112" fill="#3fb950" font-size="20" font-weight="bold">$</text>
  <!-- 正在打出的命令 -->
  <g clip-path="url(#typed)">
    <text x="90" y="112" fill="#e6edf3" font-size="20">sudo apt install linux-roadmap</text>
  </g>
  <!-- 光标 -->
  <rect x="86" y="96" width="12" height="24" fill="#e6edf3">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.5;0.5;1;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- 输出逐行浮现 -->
  <g font-size="17">
    <text x="66" y="170" fill="#8b949e">正在读取软件包列表... 完成</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.44;0.90;0.96;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g font-size="17">
    <text x="66" y="210" fill="#8b949e">正在解锁通往 Linux 之路... 完成</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.52;0.90;0.96;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g font-size="17">
    <text x="66" y="250" fill="#3fb950">已安装：基础命令 · 权限管理 · Shell 脚本 · 网络服务 · 树莓派实战</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.60;0.90;0.96;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g font-size="17">
    <text x="66" y="300" fill="#e6edf3" font-weight="bold">$ echo "你好，Linux！"</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.68;0.90;0.96;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g font-size="22">
    <text x="66" y="340" fill="#f0883e" font-weight="bold">你好，Linux！🐧</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.78;0.90;0.96;1" dur="9s" repeatCount="indefinite"/>
  </g>

  <text x="440" y="392" fill="#30363d" font-size="14" text-anchor="middle">通往 Linux 之路 · 每天进步一点点</text>
</svg>
