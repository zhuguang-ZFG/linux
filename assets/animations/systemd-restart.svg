<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
<title id="title">systemd：失败后的恢复过程</title>
<desc id="desc">重启策略帮助恢复，但不能代替根因排查。四步示意，每 12 秒一轮，播放三轮后停止。主动 stop 不应靠重启策略强行复活；错误配置需要修复而不是无限重试。</desc>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.code{font-family:Consolas,monospace}
.focus{opacity:0}
.output{opacity:0}.output.phase-0{opacity:1}
@keyframes step0{0%,24.9%{opacity:1}25%,100%{opacity:0}}.phase-0{animation:step0 12s linear 3}@keyframes step1{0%,24.9%{opacity:0}25%,49.9%{opacity:1}50%,100%{opacity:0}}.phase-1{animation:step1 12s linear 3}@keyframes step2{0%,49.9%{opacity:0}50%,74.9%{opacity:1}75%,100%{opacity:0}}.phase-2{animation:step2 12s linear 3}@keyframes step3{0%,74.9%{opacity:0}75%,100%{opacity:1}}.phase-3{animation:step3 12s linear 3}
@keyframes travel{0%,15%{transform:translateX(0)}25%,40%{transform:translateX(260px)}50%,65%{transform:translateX(520px)}75%,100%{transform:translateX(780px)}}
.token{animation:travel 12s ease-in-out 3}
@media (prefers-reduced-motion:reduce){.focus,.token,.output{animation:none}.token{display:none}}
</style>
<rect width="1080" height="640" rx="22" fill="#0d1117"/>
<text x="40" y="48" fill="#7ee787" font-size="13" letter-spacing="2">LINUX · VISUAL LAB</text>
<text x="40" y="88" fill="#f0f6fc" font-size="28" font-weight="bold">systemd：失败后的恢复过程</text>
<text x="40" y="120" fill="#9da7b3" font-size="16">重启策略帮助恢复，但不能代替根因排查</text>
<path d="M148 320 H928" fill="none" stroke="#303d4d" stroke-width="3"/>

<g>
<rect x="40" y="157" width="220" height="145" rx="14" fill="#161b22" stroke="#303d4d"/>
<rect class="focus phase-0" x="40" y="157" width="220" height="145" rx="14" fill="none" stroke="#58a6ff" stroke-width="3"/>
<text x="56" y="189" fill="#f0f6fc" font-size="18" font-weight="bold">01 正常运行</text>
<text class="code" x="56" y="221" fill="#79c0ff" font-size="13">active (running)</text>
<text x="56" y="252" fill="#c9d1d9" font-size="14">主进程提供服务</text>
<text x="56" y="276" fill="#9da7b3" font-size="14">用请求验证真实可用</text>
<circle cx="148" cy="320" r="5" fill="#62758b"/>
</g>
<g>
<rect x="300" y="157" width="220" height="145" rx="14" fill="#161b22" stroke="#303d4d"/>
<rect class="focus phase-1" x="300" y="157" width="220" height="145" rx="14" fill="none" stroke="#58a6ff" stroke-width="3"/>
<text x="316" y="189" fill="#f0f6fc" font-size="18" font-weight="bold">02 异常退出</text>
<text class="code" x="316" y="221" fill="#79c0ff" font-size="13">exit status ≠ 0</text>
<text x="316" y="252" fill="#c9d1d9" font-size="14">管理器记录失败</text>
<text x="316" y="276" fill="#9da7b3" font-size="14">日志留下退出信息</text>
<circle cx="408" cy="320" r="5" fill="#62758b"/>
</g>
<g>
<rect x="560" y="157" width="220" height="145" rx="14" fill="#161b22" stroke="#303d4d"/>
<rect class="focus phase-2" x="560" y="157" width="220" height="145" rx="14" fill="none" stroke="#58a6ff" stroke-width="3"/>
<text x="576" y="189" fill="#f0f6fc" font-size="18" font-weight="bold">03 等待策略</text>
<text class="code" x="576" y="221" fill="#79c0ff" font-size="13">RestartSec=3</text>
<text x="576" y="252" fill="#c9d1d9" font-size="14">按配置延迟重启</text>
<text x="576" y="276" fill="#9da7b3" font-size="14">频繁失败可能触发限流</text>
<circle cx="668" cy="320" r="5" fill="#62758b"/>
</g>
<g>
<rect x="820" y="157" width="220" height="145" rx="14" fill="#161b22" stroke="#303d4d"/>
<rect class="focus phase-3" x="820" y="157" width="220" height="145" rx="14" fill="none" stroke="#58a6ff" stroke-width="3"/>
<text x="836" y="189" fill="#f0f6fc" font-size="18" font-weight="bold">04 再次启动</text>
<text class="code" x="836" y="221" fill="#79c0ff" font-size="13">Restart=on-failure</text>
<text x="836" y="252" fill="#c9d1d9" font-size="14">新进程重新运行</text>
<text x="836" y="276" fill="#9da7b3" font-size="14">还要重新验证请求</text>
<circle cx="928" cy="320" r="5" fill="#62758b"/>
</g>
<rect x="40" y="350" width="1000" height="123" rx="12" fill="#172735"/>
<text x="58" y="375" fill="#7c9aab" font-size="12">示意输入与状态 · 非真实采样</text>
<g class="output phase-0">
<text class="code" x="58" y="407" fill="#b5e4d4" font-size="16">MainPID=示例进程 A</text>
<text class="code" x="58" y="434" fill="#b5e4d4" font-size="16">HTTP check: 200</text>
</g>
<g class="output phase-1">
<text class="code" x="58" y="407" fill="#b5e4d4" font-size="16">Main process exited, status=1</text>
<text class="code" x="58" y="434" fill="#b5e4d4" font-size="16">journal: 记录失败原因</text>
</g>
<g class="output phase-2">
<text class="code" x="58" y="407" fill="#b5e4d4" font-size="16">等待 RestartSec</text>
<text class="code" x="58" y="434" fill="#b5e4d4" font-size="16">此时服务请求可能失败</text>
</g>
<g class="output phase-3">
<text class="code" x="58" y="407" fill="#b5e4d4" font-size="16">MainPID=示例进程 B</text>
<text class="code" x="58" y="434" fill="#b5e4d4" font-size="16">检查日志与 HTTP 响应，确认恢复</text>
</g>
<circle class="token" cx="148" cy="320" r="8" fill="#7ee787"/>
<rect x="40" y="496" width="1000" height="106" rx="12" fill="#101f2c"/>
<text x="58" y="530" fill="#e6edf3" font-size="16">动手：在自己的用户服务中制造一次失败，观察 journal 和恢复。</text>
<text x="58" y="561" fill="#9da7b3" font-size="14">主动 stop 不应靠重启策略强行复活；错误配置需要修复而不是无限重试。</text>
<text x="58" y="585" fill="#7790a9" font-size="12">静态文字始终可读 · 支持减少动态效果设置 · 学习站可暂停与单步</text>
</svg>
